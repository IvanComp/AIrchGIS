<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="detectorlab_map.css" rel="stylesheet">
<link href="workbench.css" rel="stylesheet">
</head>
<body>
<div class="detector-map">
  <div class="map-stage">
    <div id="detectorMap" aria-label="Map"></div>
    <div class="map-controls exact-controls">
      <button type="button" class="map-fullscreen" title="Full screen">⛶</button>
      <button type="button" data-map-action="zoom-in" title="Zoom in">＋</button>
      <button type="button" data-map-action="zoom-out" title="Zoom out">−</button>
      <button type="button" class="measure-tool" data-map-action="measure" title="Measure distance">╱</button>
      <button type="button" class="coordinate-tool" data-map-action="coordinates" title="UTM coordinates and elevation">⌾</button>
      <button type="button" class="earth-tool" data-map-action="earth" title="Open the point in Google Earth" disabled>◉</button>
    </div>
    <div class="map-compass"><span>◈</span><button type="button" class="terrain-toggle" aria-pressed="true"><b>3D</b><small>Relief on</small></button></div>
    <aside id="workbench-tools" class="exact-layer-panel" aria-label="Tools and layers">
      <div class="wb-file"><span class="wb-file-name"></span><button type="button" class="wb-link" data-act="load_another">Load another file</button></div>
      <div class="wb-message" hidden></div>
      <div class="exact-panel-title"><span>◌</span><h3>TOOLS</h3></div>
      <div class="wb-tools"></div>
      <div class="exact-panel-title"><span>◌</span><h3>LAYERS</h3></div>
      <div class="layer-cards"></div>
      <div class="wb-busy" hidden><i></i><span>Working…</span></div>
    </aside>
    <button class="panel-handle" type="button" title="Hide tools" aria-label="Toggle tools panel" aria-controls="workbench-tools" aria-expanded="true">›</button>
  </div>
</div>
<div class="wb-modal" hidden><div class="wb-modal-box"><button type="button" class="wb-modal-close" title="Close">×</button><iframe title="3D view"></iframe></div></div>
<div class="toast" role="status"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script src="workbench.js"></script>
</body>
</html>
