<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="AIrchGIS">
  <defs>
    <linearGradient id="as-gold" x1="42" y1="30" x2="214" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#f1c75b"/>
      <stop offset="1" stop-color="#c99a26"/>
    </linearGradient>
    <radialGradient id="as-sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f1c75b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f1c75b" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="as-lens">
      <circle cx="112" cy="112" r="60"/>
    </clipPath>
    <style>
      @keyframes as-spin { to { transform: rotate(360deg); } }
      @keyframes as-pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }
      @keyframes as-trace { 0% { stroke-dashoffset: 300; } 55%,100% { stroke-dashoffset: 0; } }
      .as-ticks { transform-origin: 112px 112px; animation: as-spin 34s linear infinite; }
      .as-sweep { transform-origin: 112px 112px; animation: as-spin 4.5s linear infinite; }
      .as-strata { animation: as-pulse 6s ease-in-out infinite; }
      .as-plan { stroke-dasharray: 300; animation: as-trace 7s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .as-ticks, .as-sweep, .as-strata, .as-plan { animation: none; }
        .as-plan { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="#120e09"/>
  <rect x="13" y="13" width="230" height="230" rx="49" fill="none" stroke="url(#as-gold)" stroke-opacity="0.42" stroke-width="5"/>

  <g class="as-strata" stroke="#f1c75b" stroke-linecap="round" fill="none">
    <path d="M40 196c30-13 58-16 84-9 22 6 40 5 60-6" stroke-opacity="0.5" stroke-width="7"/>
    <path d="M44 216c26-10 50-12 72-6 19 5 35 4 52-4" stroke-opacity="0.3" stroke-width="6"/>
  </g>

  <circle cx="112" cy="112" r="60" fill="#1b130d"/>
  <g clip-path="url(#as-lens)">
    <g stroke="#f1c75b" stroke-opacity="0.32" stroke-width="4" stroke-linecap="round">
      <path d="M52 150h120"/>
      <path d="M60 166h104"/>
      <path d="M64 72h96"/>
    </g>
    <path class="as-plan" d="M74 90h76v56H74zM112 90v56M74 118h76" fill="none" stroke="#fff6df"
          stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <g class="as-sweep">
      <path d="M112 112 L112 42 A70 70 0 0 1 176 84 Z" fill="url(#as-sweep)"/>
    </g>
  </g>
  <circle cx="112" cy="112" r="60" fill="none" stroke="url(#as-gold)" stroke-width="13"/>

  <g class="as-ticks" stroke="#f1c75b" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round">
    <path d="M112 34v-12M112 190v12M34 112H22M190 112h12M167 57l9-9M48 176l-9 9M167 167l9 9M48 48l-9-9"/>
  </g>

  <path d="M156 156l52 52" stroke="url(#as-gold)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M156 156l52 52" stroke="#fff6df" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round" fill="none"/>
</svg>
